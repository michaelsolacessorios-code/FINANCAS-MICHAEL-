<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanças — Contas Pessoais</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F6F5F1; --panel:#FFFFFF; --ink:#1C2430; --ink-soft:#5B6470; --ink-faint:#9AA2AC;
    --border:#E4E2DC; --primary:#1B3A4B; --primary-dark:#12262F; --accent:#C99A3E;
    --ok:#2F7D5A; --danger:#B5482F; --warn:#C98A2E;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);}
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:230px; background:var(--primary-dark); color:#EDEAE2; flex-shrink:0; padding:22px 0; display:flex; flex-direction:column;}
  .sidebar .brand{padding:0 20px 22px; font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:12px;}
  .sidebar .brand span.dot{width:9px; height:9px; border-radius:50%; background:var(--accent); display:inline-block;}
  .nav-item{padding:11px 20px; cursor:pointer; font-size:14px; color:#C9C5B8; transition:.15s;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--accent); color:#1C1400; font-weight:600;}
  .main{flex:1; padding:26px 32px; max-width:1180px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .mes-nav{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:30px; padding:5px 8px;}
  .mes-nav button{border:none; background:none; cursor:pointer; font-size:17px; color:var(--primary); padding:0 7px; line-height:1;}
  .mes-nav .mes-label{font-size:13.5px; font-weight:700; min-width:140px; text-align:center; text-transform:capitalize;}
  .whoami-avatar{width:34px; height:34px; border-radius:50%; object-fit:cover;}
  .whoami-avatar-fallback{display:flex; align-items:center; justify-content:center; background:var(--primary); color:#fff; font-weight:700; font-size:14px;}
  .topbar-user{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:30px; padding:6px 8px 6px 6px;}
  .whoami{font-size:12.5px; color:var(--ink-soft); line-height:1.3;}
  .whoami b{display:block; color:var(--ink); font-size:13.5px;}
  .logout-btn{border:1px solid var(--border); background:#fff; border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; color:var(--ink-soft);}
  .logout-btn:hover{border-color:var(--ink-faint); color:var(--ink);}
  .page-header{margin-bottom:18px;}
  .eyebrow{font-size:12px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  h2{margin:2px 0 0; font-size:24px; text-transform:capitalize;}
  h3{margin:0 0 10px; font-size:16px;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:18px;}
  .hint{font-size:13px; color:var(--ink-soft); margin:0 0 12px;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-bottom:22px;}
  .stat-card{background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:12px; padding:16px 18px;}
  .stat-card.ok{border-left-color:var(--ok);}
  .stat-card.danger{border-left-color:var(--danger);}
  .stat-card.warn{border-left-color:var(--warn);}
  .stat-card .num{font-size:22px; font-weight:700;}
  .stat-card .label{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .form-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-end;}
  .form-row > div{display:flex; flex-direction:column; gap:4px;}
  .field-label{font-size:12px; color:var(--ink-soft); font-weight:600;}
  input, select, textarea{padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:#fff; color:var(--ink); font-family:inherit;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .primary-btn{background:var(--primary); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;}
  .primary-btn:hover{background:var(--primary-dark);}
  .primary-btn:disabled{opacity:.5; cursor:default;}
  .ghost-btn{background:#fff; color:var(--primary); border:1px solid var(--border); padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;}
  .ghost-btn:hover{border-color:var(--primary);}
  .danger-btn{background:#fff; color:var(--danger); border:1px solid var(--danger); padding:6px 12px; border-radius:7px; font-size:12.5px; cursor:pointer;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:2px solid var(--border);}
  td{padding:10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge.pendente{background:#FBF0DC; color:#8A5E17;}
  .badge.pago{background:#E2F0E8; color:var(--ok);}
  .badge.atrasado{background:#F7E2DC; color:var(--danger);}
  .badge.fixa{background:#E7EDF1; color:var(--primary);}
  .badge.variavel{background:#F3EFE6; color:#8A5E17;}
  .badge.plano{background:#EFE7F1; color:#6B3E7A;}
  .empty-state{text-align:center; color:var(--ink-faint); padding:34px 0; font-size:14px;}
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--primary-dark);}
  .login-card{background:#fff; border-radius:18px; padding:38px 34px; width:340px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .login-card h1{font-size:20px; margin:0 0 4px;}
  .login-card p{font-size:13.5px; color:var(--ink-soft); margin:0 0 22px;}
  .login-input{width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:9px; font-size:14px; margin-bottom:12px;}
  .login-error{background:#F7E2DC; color:var(--danger); padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:12px;}
  .msg{padding:10px 14px; border-radius:8px; font-size:13.5px; margin-top:8px;}
  .msg.ok{background:#E2F0E8; color:var(--ok);}
  .msg.err{background:#F7E2DC; color:var(--danger);}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal{background:#fff; border-radius:14px; padding:24px; width:400px; max-width:100%; max-height:90vh; overflow:auto;}
  .modal h3{margin-bottom:14px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:12px;}
  .chip{display:inline-flex; align-items:center; gap:6px; background:#F0EEE7; border-radius:20px; padding:5px 12px; font-size:13px; margin:0 6px 6px 0;}
  .chip button{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:0;}
  .loading{display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:14px; min-height:180px;}
  .split{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:16px;}
  .linha-total{display:flex; justify-content:space-between; padding:7px 0; font-size:14px; border-bottom:1px solid var(--border);}
  .linha-total:last-child{border-bottom:none;}
  .linha-total.destaque{font-weight:700; font-size:16px; padding-top:11px;}
  .secao-titulo{font-size:12px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:22px 0 10px;}
  .aviso{background:#FBF0DC; border-left:4px solid var(--warn); border-radius:10px; padding:13px 16px; font-size:13.5px; margin-bottom:16px;}
  @media (max-width:720px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:12px;}
    .sidebar .brand{display:none;}
    .nav-item{white-space:nowrap; border-radius:20px;}
    .main{padding:16px;}
    table{font-size:12.5px;}
    td,th{padding:7px 6px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const app = document.getElementById('app');

const S = {
  token: localStorage.getItem('fin_token') || null,
  eu: null,
  mes: new Date().toISOString().slice(0,7),
  pagina: 'painel',
  dados: null,
};

// =========================== API ===========================
async function api(acao, dados = {}){
  const res = await fetch('/api/data', {
    method:'POST',
    headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+S.token},
    body: JSON.stringify({acao, dados}),
  });
  const json = await res.json().catch(()=>({error:'Resposta inválida do servidor.'}));
  if(res.status === 401){ sair(); throw new Error('Sessão expirada.'); }
  if(!res.ok) throw new Error(json.error || 'Erro no servidor.');
  return json;
}

// ========================= HELPERS =========================
const money = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje = () => new Date().toISOString().slice(0,10);
const mesRef = m => `${m}-01`;
function dataPt(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function nomeMes(m){
  const [a,mm]=m.split('-');
  const n=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${n[Number(mm)-1]} de ${a}`;
}
function somaMes(m, delta){
  const [a,mm]=m.split('-').map(Number);
  const t=a*12+(mm-1)+delta;
  return `${Math.floor(t/12)}-${String((t%12)+1).padStart(2,'0')}`;
}
// data padrão dentro do mês que está aberto, sem estourar (ex: 31 em fevereiro)
function dataNoMes(m){
  const [a,mm]=m.split('-').map(Number);
  const ultimo=new Date(a,mm,0).getDate();
  const dia=Math.min(Number(hoje().slice(8,10)), ultimo);
  return `${m}-${String(dia).padStart(2,'0')}`;
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const soma = (arr, f) => arr.reduce((s,x)=>s+Number(f?f(x):x.valor||0),0);
const meus = arr => arr.filter(x=>x.user_id===S.eu.id);
const dela = arr => S.eu.parceiro_id ? arr.filter(x=>x.user_id===S.eu.parceiro_id) : [];

function nomeDe(id){
  const u = (S.dados.usuarios||[]).find(u=>u.id===id);
  return u ? u.nome : '—';
}

function confirmar(msg){
  return new Promise(r=>{
    const b=document.createElement('div'); b.className='modal-backdrop';
    b.innerHTML=`<div class="modal"><h3>Confirmar</h3><p style="font-size:14px;color:var(--ink-soft);">${esc(msg)}</p>
      <div class="modal-actions"><button class="ghost-btn" id="c1">Cancelar</button><button class="primary-btn" id="c2">Confirmar</button></div></div>`;
    document.body.appendChild(b);
    b.querySelector('#c1').onclick=()=>{b.remove();r(false);};
    b.querySelector('#c2').onclick=()=>{b.remove();r(true);};
  });
}

function modal(titulo, corpoHTML, aoSalvar, textoBotao='Salvar'){
  const b=document.createElement('div'); b.className='modal-backdrop';
  b.innerHTML=`<div class="modal"><h3>${esc(titulo)}</h3>${corpoHTML}<div id="modalMsg"></div>
    <div class="modal-actions"><button class="ghost-btn" id="mCancel">Cancelar</button>
    <button class="primary-btn" id="mOk">${esc(textoBotao)}</button></div></div>`;
  document.body.appendChild(b);
  b.onclick=e=>{ if(e.target===b) b.remove(); };
  b.querySelector('#mCancel').onclick=()=>b.remove();
  b.querySelector('#mOk').onclick=async()=>{
    const btn=b.querySelector('#mOk');
    btn.disabled=true; btn.textContent='Salvando...';
    try{
      const ok = await aoSalvar(b);
      if(ok!==false){ b.remove(); await carregar(); }
      else { btn.disabled=false; btn.textContent=textoBotao; }
    }catch(err){
      b.querySelector('#modalMsg').innerHTML=`<div class="msg err">${esc(err.message)}</div>`;
      btn.disabled=false; btn.textContent=textoBotao;
    }
  };
  return b;
}

function imagemBase64(file, maxLado=200){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('Falha ao ler a imagem.'));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Imagem inválida.'));
      img.onload=()=>{
        let {width:w,height:h}=img;
        if(w>h){ if(w>maxLado){h*=maxLado/w;w=maxLado;} } else { if(h>maxLado){w*=maxLado/h;h=maxLado;} }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.85));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

// ========================== LOGIN ==========================
function telaLogin(){
  app.innerHTML=`
    <div class="login-wrap"><div class="login-card">
      <h1>💰 Finanças</h1>
      <p>Entre com seu usuário e senha.</p>
      <div id="loginErro"></div>
      <input type="text" id="lu" class="login-input" placeholder="Usuário" autocomplete="username">
      <input type="password" id="lp" class="login-input" placeholder="Senha" autocomplete="current-password">
      <button class="primary-btn" id="lb" style="width:100%;">Entrar</button>
    </div></div>`;
  const entrar=async()=>{
    const erro=document.getElementById('loginErro'), btn=document.getElementById('lb');
    const usuario=document.getElementById('lu').value.trim(), senha=document.getElementById('lp').value.trim();
    if(!usuario||!senha){ erro.innerHTML=`<div class="login-error">Preencha usuário e senha.</div>`; return; }
    btn.disabled=true; btn.textContent='Entrando...';
    try{
      const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,senha})});
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||'Falha ao entrar.');
      if(!data.ok){ erro.innerHTML=`<div class="login-error">${esc(data.message||'Usuário ou senha incorretos.')}</div>`; return; }
      S.token=data.token; localStorage.setItem('fin_token',data.token);
      S.eu=data.usuario; S.pagina='painel';
      await carregar();
    }catch(e){
      erro.innerHTML=`<div class="login-error">${esc(e.message)}</div>`;
    }finally{ btn.disabled=false; btn.textContent='Entrar'; }
  };
  document.getElementById('lb').onclick=entrar;
  document.getElementById('lp').onkeydown=e=>{ if(e.key==='Enter') entrar(); };
}

function sair(){
  S.token=null; S.eu=null; S.dados=null;
  localStorage.removeItem('fin_token');
  telaLogin();
}

// ========================== SHELL ==========================
async function carregar(){
  try{
    const r = await api('mes',{mes:S.mes});
    S.eu = r.eu; S.dados = r;
    desenhar();
  }catch(e){
    if(S.token) app.innerHTML=`<div style="padding:40px;"><div class="msg err">${esc(e.message)}</div>
      <button class="ghost-btn" style="margin-top:14px;" onclick="location.reload()">Tentar de novo</button></div>`;
  }
}

function desenhar(){
  const itens=[
    {p:'painel',t:'Painel'},
    {p:'mes',t:'Painel do mês'},
    {p:'entradas',t:'Entradas'},
    {p:'saidas',t:'Saídas'},
    {p:'planos',t:'Planos'},
    {p:'relatorios',t:'Relatórios'},
    {p:'categorias',t:'Categorias'},
    {p:'perfil',t:'Meu perfil'},
  ];
  if(S.eu.admin) itens.push({p:'usuarios',t:'Usuários'});

  app.innerHTML=`<div class="shell">
    <div class="sidebar">
      <div class="brand"><span class="dot"></span> Finanças</div>
      ${itens.map(i=>`<div class="nav-item ${S.pagina===i.p?'active':''}" data-p="${i.p}">${i.t}</div>`).join('')}
    </div>
    <div class="main">
      <div class="topbar">
        <div class="mes-nav">
          <button id="mesAnt">‹</button>
          <span class="mes-label">${nomeMes(S.mes)}</span>
          <button id="mesProx">›</button>
        </div>
        <div class="topbar-user">
          ${S.eu.foto?`<img class="whoami-avatar" src="${S.eu.foto}" alt="">`:`<div class="whoami-avatar whoami-avatar-fallback">${esc(S.eu.nome[0].toUpperCase())}</div>`}
          <div class="whoami">Conectado como<b>${esc(S.eu.nome)}</b></div>
          <button class="logout-btn" id="btnSair">Sair</button>
        </div>
      </div>
      <div id="conteudo"></div>
    </div></div>`;

  document.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick=()=>{ S.pagina=el.dataset.p; desenhar(); };
  });
  document.getElementById('btnSair').onclick=sair;
  document.getElementById('mesAnt').onclick=async()=>{ S.mes=somaMes(S.mes,-1); await carregar(); };
  document.getElementById('mesProx').onclick=async()=>{ S.mes=somaMes(S.mes,1); await carregar(); };

  const c=document.getElementById('conteudo');
  ({painel:pgPainel, mes:pgMes, entradas:pgEntradas, saidas:pgSaidas, planos:pgPlanos,
    relatorios:pgRelatorios, categorias:pgCategorias, perfil:pgPerfil, usuarios:pgUsuarios}[S.pagina]||pgPainel)(c);
}

// ===================== 01 — PAINEL =========================
function resumoDe(lista_entradas, lista_saidas){
  const fixas = soma(lista_saidas.filter(s=>s.conta_fixa_id));
  const variaveis = soma(lista_saidas.filter(s=>!s.conta_fixa_id));
  const entradas = soma(lista_entradas);
  const pago = soma(lista_saidas.filter(s=>s.pago));
  const aPagar = soma(lista_saidas.filter(s=>!s.pago));
  return {fixas, variaveis, despesas:fixas+variaveis, entradas, pago, aPagar, disponivel:entradas-(fixas+variaveis)};
}

function blocoResumo(titulo, r){
  return `<div class="panel">
    <h3>${esc(titulo)}</h3>
    <div class="linha-total"><span>Contas fixas</span><b>${money(r.fixas)}</b></div>
    <div class="linha-total"><span>Contas variáveis</span><b>${money(r.variaveis)}</b></div>
    <div class="linha-total"><span>Total despesas</span><b style="color:var(--danger);">${money(r.despesas)}</b></div>
    <div class="linha-total"><span>Entrada</span><b style="color:var(--ok);">${money(r.entradas)}</b></div>
    <div class="linha-total destaque"><span>Disponível</span>
      <b style="color:${r.disponivel>=0?'var(--ok)':'var(--danger)'};">${money(r.disponivel)}</b></div>
  </div>`;
}

function pgPainel(c){
  const D=S.dados;
  const rMeu = resumoDe(meus(D.entradas), meus(D.saidas));
  const temParceiro = !!S.eu.parceiro_id;
  const rDela = temParceiro ? resumoDe(dela(D.entradas), dela(D.saidas)) : null;
  const rTotal = temParceiro ? resumoDe(D.entradas, D.saidas) : null;

  const pendentes = (D.planos||[]).filter(p=>p.status==='pendente');
  const avisoPlanos = pendentes.length ? `<div class="aviso">
    <b>⏳ ${pendentes.length} plano(s) pendente(s) pra iniciar:</b><br>
    ${pendentes.map(p=>`${esc(p.nome)} — ${money(p.valor_total)} a partir de ${dataPt(p.data_inicio)}`).join('<br>')}
  </div>` : '';

  c.innerHTML=`
    <div class="page-header"><div class="eyebrow">Painel</div><h2>${nomeMes(S.mes)}</h2></div>
    ${avisoPlanos}
    <div class="stat-grid">
      <div class="stat-card ok"><div class="num">${money(rMeu.pago)}</div><div class="label">Total pago no mês</div></div>
      <div class="stat-card danger"><div class="num">${money(rMeu.aPagar)}</div><div class="label">Ainda a pagar no mês</div></div>
      <div class="stat-card"><div class="num">${money(rMeu.entradas)}</div><div class="label">Entradas do mês</div></div>
      <div class="stat-card ${rMeu.disponivel>=0?'ok':'danger'}">
        <div class="num" style="color:${rMeu.disponivel>=0?'var(--ok)':'var(--danger)'};">${money(rMeu.disponivel)}</div>
        <div class="label">Saldo final ${rMeu.disponivel>=0?'(positivo)':'(negativo)'}</div></div>
    </div>
    <div class="split">
      ${blocoResumo(temParceiro?`Meu — ${S.eu.nome}`:'Resumo do mês', rMeu)}
      ${temParceiro?blocoResumo(nomeDe(S.eu.parceiro_id), rDela):''}
      ${temParceiro?blocoResumo('Casal (somado)', rTotal):''}
    </div>`;
}

// ================= 02 — PAINEL DO MÊS ======================
function linhaSaida(s, editavel){
  const atrasada = !s.pago && s.data < hoje();
  const tag = s.plano_id ? '<span class="badge plano">Plano</span>'
            : s.conta_fixa_id ? '<span class="badge fixa">Fixa</span>'
            : '<span class="badge variavel">Variável</span>';
  return `<tr>
    <td>${esc(s.nome)} ${tag}</td>
    <td>${esc(s.categoria||'—')}</td>
    <td>${dataPt(s.data)}</td>

function tabelaSaidas(lista, editavel){
  if(!lista.length) return `<div class="empty-state">Nada aqui.</div>`;
  return `<table><thead><tr><th>Conta</th><th>Categoria</th><th>Vence</th><th>Valor</th><th>Status</th>
    <th>${editavel?'':'De quem'}</th></tr></thead>
    <tbody>${lista.map(s=>linhaSaida(s,editavel)).join('')}</tbody></table>`;
}

function pgMes(c){
  const D=S.dados;
  const minhas = meus(D.saidas).sort((a,b)=>a.data<b.data?-1:1);
  const q1 = minhas.filter(s=>Number(s.data.slice(8,10))<=15);
  const q2 = minhas.filter(s=>Number(s.data.slice(8,10))>15);
  const t1 = soma(q1), t2 = soma(q2);
  const entrada05 = soma(meus(D.entradas).filter(e=>Number(e.data.slice(8,10))<=15));

  const futuras = (D.futuras||[]);
  const porMes = {};
  futuras.forEach(f=>{ (porMes[f.mes_ref.slice(0,7)] = porMes[f.mes_ref.slice(0,7)]||[]).push(f); });

  c.innerHTML=`
    <div class="page-header"><div class="eyebrow">Painel do mês</div><h2>${nomeMes(S.mes)}</h2></div>
    <div class="aviso">Referência de recebimento: <b>dia 05</b> — você tem ${money(entrada05)} entrando até o dia 15.</div>

    <div class="panel">
      <h3>Vencem do dia 01 ao 15 — ${money(t1)}</h3>
      ${tabelaSaidas(q1,true)}
    </div>
    <div class="panel">
      <h3>Vencem do dia 16 ao fim do mês — ${money(t2)}</h3>
      ${tabelaSaidas(q2,true)}
    </div>

    <div class="secao-titulo">Contas futuras (parceladas e planos — fixas não entram, são infinitas)</div>
    ${Object.keys(porMes).length===0?`<div class="panel"><div class="empty-state">Nenhuma conta futura lançada.</div></div>`:
      Object.keys(porMes).sort().map(m=>`<div class="panel">
        <h3>${nomeMes(m)} — ${money(soma(porMes[m]))}</h3>
        ${tabelaSaidas(porMes[m],false)}
      </div>`).join('')}
  `;
  ligarBotoesSaida(c);
}

function ligarBotoesSaida(c){
  c.querySelectorAll('.btnPagar').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    await api('saida.pago',{id:b.dataset.id, pago: b.dataset.pago!=='1'});
    await carregar();
  });
  c.querySelectorAll('.btnDelSaida').forEach(b=>b.onclick=async()=>{
    const grupo=b.dataset.grupo;
    let grupoTodo=false;
    if(grupo){
      grupoTodo = await confirmar('Essa conta é parcelada. Excluir TODAS as parcelas? (Cancelar = exclui só essa)');
    } else {
      if(!(await confirmar('Excluir essa conta?'))) return;
    }
    await api('saida.excluir',{id:b.dataset.id, grupo_id:grupo, grupoTodo});
    await carregar();
  });
  c.querySelectorAll('.btnEdSaida').forEach(b=>b.onclick=()=>{
    const s=S.dados.saidas.find(x=>x.id===b.dataset.id);
    modal('Editar conta', `
      <label class="field-label">Nome</label>
      <input class="login-input" id="eNome" value="${esc(s.nome)}">
      <label class="field-label">Categoria</label>
      <select class="login-input" id="eCat">${opcoesCategoria(s.categoria)}</select>
      <label class="field-label">Valor (R$)</label>
      <input class="login-input" id="eValor" type="number" step="0.01" value="${s.valor}">
      <label class="field-label">Data</label>
      <input class="login-input" id="eData" type="date" value="${s.data}">
      ${s.conta_fixa_id?`<p class="hint" style="margin-top:6px;">Conta fixa: o valor alterado vale deste mês em diante.</p>`:''}
    `, async b2=>{
      await api('saida.salvar',{
        id:s.id, nome:b2.querySelector('#eNome').value.trim(),
        categoria:b2.querySelector('#eCat').value,
        valor:b2.querySelector('#eValor').value, data:b2.querySelector('#eData').value,
      });
    });
  });
}

function opcoesCategoria(sel){
  return (S.dados.categorias||[]).map(c=>`<option value="${esc(c.nome)}" ${c.nome===sel?'selected':''}>${esc(c.nome)}</option>`).join('');
}

      valor:b.querySelector('#cValor').value, dia:b.querySelector('#cDia').value,
      ativa:b.querySelector('#cAtiva').checked, mes:S.mes,
    });
  });
  c.querySelectorAll('.btnEdCF').forEach(b=>b.onclick=()=>{
    const f=fixas.find(x=>x.id===b.dataset.id);

      await api('contaFixa.salvar',{
        id:f.id, nome:b2.querySelector('#cNome').value.trim(), categoria:b2.querySelector('#cCat').value,
        valor:b2.querySelector('#cValor').value, dia:b2.querySelector('#cDia').value,

      });

    </select>

      <label class="field-label">Quantas vezes?</label>
      <input class="login-input" id="pParcelas" type="number" min="2" max="60" value="${p.parcelas>1?p.parcelas:12}">
    </div>
    <label class="field-label">Data de início</label>
    <input class="login-input" id="pData" type="date" value="${p.data_inicio||hoje()}">`;

  const ligarForma = b => {

      b.querySelector('#pBlocoParc').style.display = e.target.value==='parcelado'?'block':'none';
    };

    modal('Adiar plano', `
      <p class="hint">Escolha a nova data de início de "${esc(p.nome)}".</p>
      <label class="field-label">Nova data</label>
      <input class="login-input" id="aData" type="date" value="${p.data_inicio}">
    `, async b2=>{
      await api('plano.adiar',{id:p.id, nova_data:b2.querySelector('#aData').value});
    }, 'Adiar');
  });
  c.querySelectorAll('.btnConcluir').forEach(b=>b.onclick=async()=>{
    await api('plano.concluir',{id:b.dataset.id}); await carregar();
  });
  c.querySelectorAll('.btnDelP').forEach(b=>b.onclick=async()=>{
    if(!(await confirmar('Excluir esse plano? As despesas já geradas continuam lá.'))) return;
    await api('plano.excluir',{id:b.dataset.id}); await carregar();
  });
}

// ==================== 06 — RELATÓRIOS ======================
function pgRelatorios(c){
  const D=S.dados;
  const minhasE=meus(D.entradas), minhasS=meus(D.saidas);
  const porCat={};
  minhasS.forEach(s=>{ porCat[s.categoria||'Sem categoria']=(porCat[s.categoria||'Sem categoria']||0)+Number(s.valor); });
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const planos=D.planos||[];

  c.innerHTML=`
    <div class="page-header"><div class="eyebrow">Relatórios</div><h2>${nomeMes(S.mes)}</h2></div>
    <div class="panel">
      <label class="field-label">Mês / ano</label>
      <input type="month" id="relMes" value="${S.mes}" style="max-width:190px;">
      <p class="hint" style="margin:8px 0 0;">Use as setas no topo ou escolha aqui.</p>
    </div>

    <div class="split">
      <div class="panel">
        <h3>Entradas do mês — ${money(soma(minhasE))}</h3>
        ${minhasE.length?`<table><thead><tr><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead>
          <tbody>${minhasE.map(e=>`<tr><td>${esc(e.descricao)}</td><td>${esc(e.tipo)}</td><td><b>${money(e.valor)}</b></td></tr>`).join('')}</tbody></table>`
          :`<div class="empty-state">Sem entradas.</div>`}
      </div>
      <div class="panel">
        <h3>Saídas por categoria — ${money(soma(minhasS))}</h3>
        ${cats.length?`<table><thead><tr><th>Categoria</th><th>Valor</th><th>%</th></tr></thead>
          <tbody>${cats.map(([n,v])=>`<tr><td>${esc(n)}</td><td><b>${money(v)}</b></td>
            <td>${(v/soma(minhasS)*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`
          :`<div class="empty-state">Sem saídas.</div>`}
      </div>
    </div>

    <div class="panel"><h3>Gastos por categoria</h3><canvas id="gCat" height="90"></canvas></div>
    <div class="panel"><h3>Evolução do ano — entradas x saídas</h3><canvas id="gAno" height="90"></canvas></div>

    <div class="panel">
      <h3>Planos</h3>
      <div class="split">
        <div><b>Ativos (${planos.filter(p=>p.status==='ativo').length})</b><br>
          <span class="hint">${planos.filter(p=>p.status==='ativo').map(p=>esc(p.nome)).join(', ')||'—'}</span></div>
        <div><b>Futuros / pendentes (${planos.filter(p=>p.status==='pendente').length})</b><br>
          <span class="hint">${planos.filter(p=>p.status==='pendente').map(p=>esc(p.nome)).join(', ')||'—'}</span></div>
        <div><b>Concluídos (${planos.filter(p=>p.status==='concluido').length})</b><br>
          <span class="hint">${planos.filter(p=>p.status==='concluido').map(p=>esc(p.nome)).join(', ')||'—'}</span></div>
      </div>
    </div>`;

  document.getElementById('relMes').onchange=async e=>{ S.mes=e.target.value; await carregar(); };

  new Chart(document.getElementById('gCat'),{
    type:'bar',
    data:{labels:cats.map(x=>x[0]), datasets:[{label:'Gasto', data:cats.map(x=>x[1]), backgroundColor:'#1B3A4B'}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>money(v)}}}}
  });

  api('ano',{ano:S.mes.slice(0,4)}).then(r=>{
    const meses=Array.from({length:12},(_,i)=>`${S.mes.slice(0,4)}-${String(i+1).padStart(2,'0')}`);
    const ent=meses.map(m=>soma(r.entradas.filter(e=>e.user_id===S.eu.id && e.mes_ref.slice(0,7)===m)));
    const sai=meses.map(m=>soma(r.saidas.filter(s=>s.user_id===S.eu.id && s.mes_ref.slice(0,7)===m)));
    new Chart(document.getElementById('gAno'),{
      type:'line',
      data:{labels:meses.map(m=>nomeMes(m).split(' de ')[0]), datasets:[
        {label:'Entradas', data:ent, borderColor:'#2F7D5A', backgroundColor:'#2F7D5A', tension:.3},
        {label:'Saídas', data:sai, borderColor:'#B5482F', backgroundColor:'#B5482F', tension:.3},
      ]},
      options:{scales:{y:{ticks:{callback:v=>money(v)}}}}
    });
  }).catch(()=>{});
}

// ==================== CATEGORIAS ===========================
function pgCategorias(c){
  const cats=S.dados.categorias||[];
  c.innerHTML=`
    <div class="page-header"><div class="eyebrow">Categorias</div><h2>Minhas categorias</h2></div>
    <div class="panel">
      <p class="hint">Cada pessoa tem as suas. As da Renata são separadas das suas.</p>
      <div class="form-row">
        <input type="text" id="novaCat" placeholder="Nome da nova categoria">
        <button class="primary-btn" id="btnAddCat">Adicionar</button>
      </div>
      <div style="margin-top:10px;">
        ${cats.length?cats.map(x=>`<span class="chip">${esc(x.nome)} <button class="btnDelCat" data-id="${x.id}">✕</button></span>`).join('')
          :`<div class="empty-state">Nenhuma categoria.</div>`}
      </div>
    </div>`;
  document.getElementById('btnAddCat').onclick=async()=>{
    const n=document.getElementById('novaCat').value.trim();
    if(!n) return;
    await api('categoria.salvar',{nome:n}); await carregar();
  };
  c.querySelectorAll('.btnDelCat').forEach(b=>b.onclick=async()=>{
    if(!(await confirmar('Remover essa categoria? As contas que já usam ela continuam normais.'))) return;
    await api('categoria.excluir',{id:b.dataset.id}); await carregar();
  });
}

// ====================== PERFIL =============================
function pgPerfil(c){
  const parceiro = S.eu.parceiro_id ? nomeDe(S.eu.parceiro_id) : null;
  c.innerHTML=`
    <div class="page-header"><div class="eyebrow">Meu perfil</div><h2>${esc(S.eu.nome)}</h2></div>
    <div class="panel" style="max-width:460px;">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
        ${S.eu.foto?`<img src="${S.eu.foto}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;">`
          :`<div class="whoami-avatar whoami-avatar-fallback" style="width:70px;height:70px;font-size:26px;">${esc(S.eu.nome[0].toUpperCase())}</div>`}
        <div>
          <div style="font-weight:700;font-size:16px;">${esc(S.eu.nome)}</div>
          <div class="hint" style="margin:2px 0 0;">Usuário: ${esc(S.eu.usuario)}</div>
          <div class="hint" style="margin:2px 0 0;">${parceiro?`Vinculado(a) como casal com <b>${esc(parceiro)}</b>`:'Sem vínculo de casal'}</div>
        </div>
      </div>
      <label class="field-label">Trocar foto</label>
      <input type="file" id="fFoto" accept="image/*">
      <div id="msgFoto"></div>
      <hr style="border:none;border-top:1px solid var(--border);margin:18px 0;">
      <label class="field-label">Trocar minha senha</label>
      <div class="form-row">
        <input type="password" id="novaSenha" placeholder="Nova senha">
        <button class="primary-btn" id="btnSenha">Salvar senha</button>
      </div>
      <div id="msgSenha"></div>
    </div>`;
  document.getElementById('fFoto').onchange=async()=>{
    const f=document.getElementById('fFoto').files[0]; if(!f) return;
    const m=document.getElementById('msgFoto');
    try{
      const b64=await imagemBase64(f);
      await api('perfil.foto',{foto:b64});
      m.innerHTML=`<div class="msg ok">Foto atualizada.</div>`;
      await carregar();
    }catch(e){ m.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
  document.getElementById('btnSenha').onclick=async()=>{
    const s=document.getElementById('novaSenha').value.trim();
    const m=document.getElementById('msgSenha');
    if(s.length<4){ m.innerHTML=`<div class="msg err">Senha muito curta.</div>`; return; }
    await api('perfil.senha',{senha:s});
    document.getElementById('novaSenha').value='';
    m.innerHTML=`<div class="msg ok">Senha alterada.</div>`;
  };
}

// ===================== USUÁRIOS (admin) ====================
function pgUsuarios(c){
  const us=S.dados.usuarios||[];
  c.innerHTML=`
    <div class="page-header"><div class="eyebrow">Usuários</div><h2>Quem tem acesso</h2></div>
    <div class="panel">
      <h3>Adicionar pessoa</h3>
      <div class="form-row">
        <div><label class="field-label">Nome</label><input type="text" id="uNome"></div>
        <div><label class="field-label">Usuário (login)</label><input type="text" id="uLogin"></div>
        <div><label class="field-label">Senha</label><input type="text" id="uSenha"></div>
        <button class="primary-btn" id="btnAddU">Adicionar</button>
      </div>
      <div id="msgU"></div>
    </div>
    <div class="panel">
      <h3>Pessoas</h3>
      <p class="hint">O vínculo de casal soma os dois no painel, mantendo a visão individual de cada um.</p>
      <table><thead><tr><th>Nome</th><th>Login</th><th>Admin</th><th>Vínculo de casal</th><th>Nova senha</th><th></th></tr></thead>
        <tbody>${us.map(u=>`<tr>
          <td>${esc(u.nome)}</td><td>${esc(u.usuario)}</td><td>${u.admin?'Sim':'Não'}</td>
          <td><select class="selVinc" data-id="${u.id}" style="min-width:150px;">
            <option value="">— sem vínculo —</option>
            ${us.filter(o=>o.id!==u.id).map(o=>`<option value="${o.id}" ${u.parceiro_id===o.id?'selected':''}>${esc(o.nome)}</option>`).join('')}
          </select></td>
          <td><input type="text" class="inSenha" data-id="${u.id}" placeholder="deixe em branco" style="width:150px;"></td>
          <td style="white-space:nowrap;">
            <button class="ghost-btn btnSalvarU" data-id="${u.id}">Salvar</button>
            ${u.id!==S.eu.id?`<button class="danger-btn btnDelU" data-id="${u.id}">Remover</button>`:''}
          </td></tr>`).join('')}</tbody></table>
    </div>`;

  document.getElementById('btnAddU').onclick=async()=>{
    const m=document.getElementById('msgU');
    const nome=document.getElementById('uNome').value.trim();
    const usuario=document.getElementById('uLogin').value.trim();
    const senha=document.getElementById('uSenha').value.trim();
    if(!nome||!usuario||!senha){ m.innerHTML=`<div class="msg err">Preencha tudo.</div>`; return; }
    const r=await api('usuario.criar',{nome,usuario,senha});
    if(r.ok===false){ m.innerHTML=`<div class="msg err">${esc(r.message)}</div>`; return; }
    await carregar();
  };
  c.querySelectorAll('.btnSalvarU').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id;
    const senha=c.querySelector(`.inSenha[data-id="${id}"]`).value.trim();
    const vinc=c.querySelector(`.selVinc[data-id="${id}"]`).value;
    if(senha) await api('usuario.senha',{id,senha});
    await api('usuario.vincular',{id_1:id, id_2:vinc||null});
    await carregar();
  });
  c.querySelectorAll('.btnDelU').forEach(b=>b.onclick=async()=>{
    if(!(await confirmar('Remover essa pessoa? TODOS os lançamentos dela serão apagados.'))) return;
    await api('usuario.excluir',{id:b.dataset.id}); await carregar();
  });
}

// ======================== INÍCIO ===========================
(async function(){
  if(!S.token){ telaLogin(); return; }
  app.innerHTML=`<div class="loading" style="min-height:100vh;">Carregando…</div>`;
  await carregar();
})();
</script>
